services:
  - type: web
    name: lins-gen-backend
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma db push && node prisma/seed.js
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard (e.g. mongodb+srv://user:pass@cluster.mongodb.net/leadgen)
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: CLIENT_URL
        value: https://leads.linsinfotech.in
