services:
  - type: web
    name: lins-gen-backend
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma db push && node prisma/seed.js
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_API_KEY
        value: AIzaSyAu8fUwkKGI8jhBddqMS7RsZAiVCMjRTDA
      - key: CLIENT_URL
        value: "*"
